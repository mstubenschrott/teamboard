<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TeamBoard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 bg-white">
	<h1 class="display-4 mb-1">TeamBoard</h1>
	<div id="board" class="d-grid gap-4 mt-4" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));">
		<!-- All the columns of the board come here -->
		<div class="column bg-warning rounded p-3">
			<h2 class="text-uppercase text-secondary fw-bold small mb-3">To Do</h2>
			<div class="ticket bg-white rounded shadow-sm p-2 mb-2 small">
				Set up project repository
				<div class="assignee text-secondary small mt-1">Alice</div>
			</div>
			<div class="ticket bg-white rounded shadow-sm p-2 mb-2 small">
				Write API specification
				<div class="assignee text-secondary small mt-1">Unassigned</div>
			</div>
			<div class="ticket bg-white rounded shadow-sm p-2 mb-2 small">
				Design database schema
				<div class="assignee text-secondary small mt-1">Bob</div>
			</div>
		</div>
		<div class="column bg-body-secondary rounded p-3">
			<h2 class="text-uppercase text-secondary fw-bold small mb-3">In Progress</h2>
			<div class="ticket bg-white rounded shadow-sm p-2 mb-2 small">
				Implement ticket creation endpoint
				<div class="assignee text-secondary small mt-1">Carol</div>
			</div>
			<div class="ticket bg-white rounded shadow-sm p-2 mb-2 small">
				Build board UI layout
				<div class="assignee text-secondary small mt-1">Alice</div>
			</div>
		</div>
		<div class="column bg-success rounded p-3">
			<h2 class="text-uppercase text-secondary fw-bold small mb-3">Done</h2>
			<div class="ticket bg-white rounded shadow-sm p-2 mb-2 small">
				Define ticket data model
				<div class="assignee text-secondary small mt-1">Bob</div>
			</div>
			<div class="ticket bg-white rounded shadow-sm p-2 mb-2 small">
				Set up Node.js + Express boilerplate
				<div class="assignee text-secondary small mt-1">Carol</div>
			</div>
		</div>
	</div>
</body>

</html>
