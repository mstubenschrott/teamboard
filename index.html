<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TeamBoard</title>
	<style>
		body {
			font-family: sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 2rem;
			margin: 0;
			background: #f4f5f7;
			color: #172b4d;
		}

		h1 {
			font-size: 2.5rem;
			margin-bottom: 0.5rem;
		}

		p {
			color: #5e6c84;
			font-size: 1.1rem;
		}

		#board {
			display: flex;
			gap: 1.5rem;
			margin-top: 2rem;
			align-items: flex-start;
		}

		.column {
			background: #ebecf0;
			border-radius: 0.5rem;
			padding: 1rem;
			width: 220px;
		}

		.column h2 {
			font-size: 0.85rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: #5e6c84;
			margin: 0 0 0.75rem;
		}

		.ticket {
			background: #fff;
			border-radius: 0.375rem;
			padding: 0.65rem 0.75rem;
			margin-bottom: 0.5rem;
			box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
			font-size: 0.9rem;
		}

		.ticket .assignee {
			margin-top: 0.4rem;
			font-size: 0.75rem;
			color: #5e6c84;
		}
	</style>
</head>

<body>
	<h1>TeamBoard</h1>
	<div id="board">
		<!-- The 3 columns -->
		<div class="column">
			<h2>To Do</h2>
			<div class="ticket">
				Set up project repository
				<div class="assignee">Alice</div>
			</div>
			<div class="ticket">
				Write API specification
				<div class="assignee">Unassigned</div>
			</div>
			<div class="ticket">
				Design database schema
				<div class="assignee">Bob</div>
			</div>
		</div>
		<div class="column">
			<h2>In Progress</h2>
			<div class="ticket">
				Implement ticket creation endpoint
				<div class="assignee">Carol</div>
			</div>
			<div class="ticket">
				Build board UI layout
				<div class="assignee">Alice</div>
			</div>
		</div>
		<div class="column">
			<h2>Done</h2>
			<div class="ticket">
				Define ticket data model
				<div class="assignee">Bob</div>
			</div>
			<div class="ticket">
				Set up Node.js + Express boilerplate
				<div class="assignee">Carol</div>
			</div>
		</div>
	</div>
</body>

</html>
