<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TeamBoard</title>
	<style>
		body {
			font-family: sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			background: #f4f5f7;
			color: #172b4d;
		}

		h1 {
			font-size: 2.5rem;
			margin-bottom: 0.5rem;
		}

		p {
			color: #5e6c84;
			font-size: 1.1rem;
		}

		.badge {
			margin-top: 1.5rem;
			padding: 0.4rem 1rem;
			background: #0052cc;
			color: #fff;
			border-radius: 2rem;
			font-size: 0.85rem;
			letter-spacing: 0.05em;
		}
	</style>
</head>

<body>
	<h1>TeamBoard</h1>
	<div id="board">
		<p>Lightweight ticket management for small teams.</p>
		<span class="badge">Coming soon</span>
	</div>
</body>

</html>
